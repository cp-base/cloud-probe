name: UI research - Foundation regression
on:
  push:
    branches: [research/ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import Godot project
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot-foundation --import --quit
      - name: Test UI layout
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_layout_smoke.gd
      - name: Test UI with full Foundation
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_foundation_integration.gd
      - name: Regression - baseline UI
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/test_ui.gd
      - name: Regression - gameplay
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/test_session.gd
