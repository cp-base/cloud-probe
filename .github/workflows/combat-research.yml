name: Combat Research (isolated branch)
on:
  push:
    branches: [research/combat]
    paths:
      - 'godot-foundation/research/combat/**/*.gd'
      - 'godot-foundation/research/combat/**/*.tscn'
      - 'godot-foundation/research/combat/**/*.tres'
      - 'godot-foundation/tests/test_combat_research.gd'
      - 'godot-foundation/tests/test_combat_ui.gd'
      - 'godot-foundation/tests/test_combat_journey.gd'
      - 'godot-foundation/tests/test_combat_journey_ui.gd'
      - '.github/workflows/combat-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 from official stable archive
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
      - name: Import scripts and scenes
        run: |
          godot --headless --editor --path godot-foundation --import --quit > /tmp/import.log 2>&1
          cat /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*Failed loading' /tmp/import.log
      - name: Foundation and combat tests
        shell: bash
        run: |
          mkdir -p godot-foundation/tests/.state
          set -o pipefail
          for test in test_session test_ui test_combat_research test_combat_journey; do
            godot --headless --path godot-foundation --script "res://tests/$test.gd" | tee "/tmp/$test.log"
          done
          godot --headless --path godot-foundation --script res://tests/test_combat_ui.gd -- --fixture | tee /tmp/test_combat_ui.log
          godot --headless --path godot-foundation --script res://tests/test_combat_journey_ui.gd -- --journey | tee /tmp/test_combat_journey_ui.log
      - name: Install CJK fonts for screenshot evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Capture fixture screenshot
        shell: bash
        run: |
          xvfb-run -a godot --path godot-foundation --rendering-method gl_compatibility --script res://research/combat/capture_fixture.gd -- --fixture | tee /tmp/capture.log
      - name: Capture naturally generated encounter at 540p (actual Godot viewport size logged)
        shell: bash
        run: |
          xvfb-run -a godot --path godot-foundation --rendering-method gl_compatibility --resolution 960x540 --script res://research/combat/capture_journey.gd -- --journey | tee /tmp/capture_journey.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-research-evidence
          path: |
            /tmp/*.log
            godot-foundation/research/combat/evidence/*.png
          if-no-files-found: warn

      - name: Commit runtime evidence to isolated research branch
        if: success()
        shell: bash
        run: |
          mkdir -p godot-foundation/research/combat/evidence
          cp /tmp/import.log /tmp/test_session.log /tmp/test_ui.log /tmp/test_combat_research.log /tmp/test_combat_ui.log /tmp/test_combat_journey.log /tmp/test_combat_journey_ui.log /tmp/capture.log /tmp/capture_journey.log godot-foundation/research/combat/evidence/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot-foundation/research/combat/evidence/
          git diff --cached --quiet && exit 0
          git commit -m "test(combat): attach Godot run logs and screenshot [skip ci]"
          git push origin HEAD:research/combat
