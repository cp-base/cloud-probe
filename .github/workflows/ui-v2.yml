name: UI v2 adaptive layout regression
on:
  push:
    branches: [research/ui-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import Foundation
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot-foundation --import --quit
      - name: Original UI layout tests
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_layout_smoke.gd
      - name: New compact UI tests
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_compact_smoke.gd
      - name: Real mouse interaction with SubViewport
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_mouse_smoke.gd
      - name: Render UI preview screenshots
        run: xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path godot-foundation --script res://tests/ui_v2_capture.gd
      - name: Upload rendered UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-screenshots
          path: godot-foundation/research/ui-v2/evidence/*.png
          if-no-files-found: error
      - name: Foundation UI integration
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/ui_foundation_integration.gd
      - name: Baseline UI regression
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/test_ui.gd
      - name: Gameplay regression
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-foundation --script res://tests/test_session.gd
